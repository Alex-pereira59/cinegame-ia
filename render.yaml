# Blueprint de Render: crea la base PostgreSQL y el servicio web (Docker).
# autoDeploy: false -> solo GitHub Actions despliega (después de pasar las pruebas).
databases:
  - name: cinegame-db
    plan: free
    databaseName: cinegame
    user: cinegame

services:
  - type: web
    name: cinegame-ai
    runtime: docker
    plan: free
    autoDeploy: false
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cinegame-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: LLM_API_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: APP_TIMEZONE
        value: America/Guatemala
